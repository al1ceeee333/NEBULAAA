name: Build NEBULA for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Dateistruktur vorbereiten
        run: |
          mkdir -p Source
          for file in PluginProcessor.cpp PluginProcessor.h PluginEditor.cpp PluginEditor.h; do
            if [ -f "$file" ]; then mv "$file" Source/; fi
          done

      - name: Plugin konfigurieren
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: NEBULA bauen
        run: cmake --build build --config Release --target NEBULA_VST3

      - name: Plugin signieren
        run: codesign --force --deep --sign - "build/NEBULA_artefacts/Release/VST3/NEBULA.vst3"

      - name: ZIP erstellen
        run: ditto -c -k --keepParent "build/NEBULA_artefacts/Release/VST3/NEBULA.vst3" "NEBULA-macOS-VST3.zip"

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-macOS-VST3
          path: NEBULA-macOS-VST3.zip
